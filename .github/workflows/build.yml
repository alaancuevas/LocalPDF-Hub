name: Build

# Called by ci.yml and release.yml: runs the tests, packages the app on each
# system, runs the packaged binary and uploads what users would download.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: dist/LocalPDF-Hub.exe
            download: dist/LocalPDF-Hub.exe
            artifact: LocalPDF-Hub-windows
          - os: macos-14
            binary: dist/LocalPDF-Hub.app/Contents/MacOS/LocalPDF-Hub
            download: dist/LocalPDF-Hub-macos-arm64.dmg
            artifact: LocalPDF-Hub-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build the app
        run: python build.py

      # Tests cover the source; this runs the frozen binary, which is what
      # users download and where missing hidden imports would show up.
      - name: Smoke test the packaged app
        run: python scripts/smoke_test.py ${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.download }}
          if-no-files-found: error
