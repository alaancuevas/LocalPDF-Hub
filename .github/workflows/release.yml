name: Release

# Pushing a tag such as v4.0.0 builds and smoke-tests both apps, then
# publishes them as a GitHub release with that version's CHANGELOG section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against pyproject.toml and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$version\"$" pyproject.toml \
            || { echo "pyproject.toml is not at version $version"; exit 1; }
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md \
            || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "LocalPDF Hub ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
