name: CI

# Pushes to main and pull requests run on their own. Other branches are run
# by hand (Actions > CI > Run workflow), since macOS minutes are the costly ones.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: mypy
        run: mypy src

  build:
    uses: ./.github/workflows/build.yml
