name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ["v4.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: python build.py

      # Tests cover the source; this runs the frozen binary, which is what
      # users download and where missing hidden imports would show up.
      - name: Smoke test the executable
        run: python scripts/smoke_test.py dist/LocalPDF-Hub.exe

      - uses: actions/upload-artifact@v4
        with:
          name: LocalPDF-Hub-windows
          path: dist/LocalPDF-Hub.exe
          if-no-files-found: error
